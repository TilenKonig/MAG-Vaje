<app-page-header naslov="Uporabniki">
  <button mat-flat-button (click)="odpri()">Dodaj uporabnika</button>
</app-page-header>

<table>
  <tr><th>Ime</th><th>Email</th><th>Telefon</th><th>Vloga</th><th></th></tr>
  @for (uporabnik of uporabniki.value(); track uporabnik.id) {
    <tr>
      <td>{{ uporabnik.ime }} {{ uporabnik.priimek }}</td>
      <td>{{ uporabnik.email }}</td>
      <td>{{ uporabnik.telefon }}</td>
      <td>{{ uporabnik.vloga }}</td>
      <td>
        <button mat-button (click)="odpri(uporabnik)">Uredi</button>
        <button mat-button (click)="izbrisi(uporabnik)">Izbriši</button>
      </td>
    </tr>
  }
</table>
