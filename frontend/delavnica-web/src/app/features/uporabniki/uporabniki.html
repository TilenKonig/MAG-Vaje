<app-page-header naslov="Uporabniki">
  <button mat-flat-button (click)="dodaj(obrazecPredloga)">Dodaj uporabnika</button>
</app-page-header>

<table>
  <tr><th>Ime</th><th>Email</th><th>Telefon</th><th>Vloga</th><th></th></tr>
  @for (uporabnik of uporabniki.value(); track uporabnik.id) {
    <tr>
      <td>{{ uporabnik.ime }} {{ uporabnik.priimek }}</td>
      <td>{{ uporabnik.email }}</td>
      <td>{{ uporabnik.telefon }}</td>
      <td>{{ uporabnik.vloga }}</td>
      <td>
        <button mat-button (click)="uredi(obrazecPredloga, uporabnik)">Uredi</button>
        <button mat-button (click)="izbrisi(uporabnik)">Izbriši</button>
      </td>
    </tr>
  }
</table>

<!-- polja obrazca, prikaže jih okno -->
<ng-template #obrazecPredloga>
  <app-polje label="Ime" [formField]="obrazec.ime" />
  <app-polje label="Priimek" [formField]="obrazec.priimek" />
  <app-polje label="Email" type="email" [formField]="obrazec.email" />
  <app-polje [label]="urejanjeId() ? 'Geslo (prazno = nespremenjeno)' : 'Geslo'" type="password" [formField]="obrazec.geslo" />
  <app-polje label="Telefon" [formField]="obrazec.telefon" />
  <app-izbira label="Vloga" [moznosti]="vloge" [formField]="obrazec.vloga" />
</ng-template>
