services:
  db:
    build: ./db
    image: tilenkonig/delavnica-db:1.0.1 # probi ce dela
    environment:
      COCKROACH_DATABASE: delavnica 
    ports:
      - "26257:26257" # SQL
      - "8081:8081"   # DB Console
    volumes:
      - db-data:/cockroach/cockroach-data

  api:
    build: ./backend/delavnica-api
    image: tilenkonig/delavnica-api:1.0.1 
    depends_on:
      - db
    restart: on-failure 
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:26257/delavnica?sslmode=disable
    ports:
      - "8080:8080" # REST API in Swagger

volumes:
  db-data:
