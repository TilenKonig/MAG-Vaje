services:
  db:
    build: ./db
    image: tilenkonig/delavnica-db:1.0.1 # probi ce dela
    environment:
      COCKROACH_DATABASE: ${DB_NAME} 
    ports:
      - "26257:26257" 
      - "8081:8081"
    volumes:
      - db-data:/cockroach/cockroach-data

  api:
    build: ./backend/delavnica-api
    image: tilenkonig/delavnica-api:1.0.1 
    depends_on:
      - db
    restart: on-failure 
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:26257/${DB_NAME}?sslmode=disable
    ports:
      - "8080:8080" 

volumes:
  db-data:
