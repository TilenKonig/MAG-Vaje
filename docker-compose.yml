services:
  db:
    build: ./db
    image: tilenkonig/delavnica-db:1.0.0 # pred nalaganjem na Docker Hub dodaj svoje uporabniško ime (uporabnik/delavnica-db:1.0.0)
    environment:
      COCKROACH_DATABASE: delavnica # ustvari bazo ob prvem zagonu
    ports:
      - "26257:26257" # SQL
      - "8081:8081"   # DB Console
    volumes:
      - db-data:/cockroach/cockroach-data

  api:
    build: ./backend/delavnica-api
    image: tilenkonig/delavnica-api:1.0.0 # pred nalaganjem na Docker Hub dodaj svoje uporabniško ime
    depends_on:
      - db
    restart: on-failure # če baza še ni pripravljena, se backend ponovno zažene
    environment:
      # v omrežju compose je baza dosegljiva pod imenom storitve "db"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:26257/delavnica?sslmode=disable
    ports:
      - "8080:8080" # REST API in Swagger

volumes:
  db-data:
