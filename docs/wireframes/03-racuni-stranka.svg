<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="sans-serif" font-size="14">
  <title>Wireframe: računi (pogled stranke in vodje)</title>
  <rect x="1" y="1" width="898" height="478" fill="#fff" stroke="#000"/>
  <!-- glava z menijem stranke -->
  <rect x="1" y="1" width="898" height="48" fill="#eee" stroke="#000"/>
  <text x="20" y="31" font-weight="bold">Mehanična delavnica</text>
  <text x="260" y="31">Vozila</text>
  <text x="330" y="31">Nalogi</text>
  <text x="390" y="31" font-weight="bold" text-decoration="underline">Računi</text>
  <text x="880" y="31" text-anchor="end">janez@primer.si (STRANKA) | Odjava</text>
  <text x="260" y="66" font-size="11" fill="#555">Stranka nima menijev Deli in Uporabniki. (US-02)</text>

  <text x="20" y="105" font-size="22" font-weight="bold">Računi</text>

  <!-- tabela -->
  <rect x="20" y="125" width="860" height="30" fill="#ddd" stroke="#000"/>
  <text x="30" y="145" font-weight="bold">Datum</text>
  <text x="170" y="145" font-weight="bold">Vozilo</text>
  <text x="330" y="145" font-weight="bold">Znesek</text>
  <text x="470" y="145" font-weight="bold">Plačan</text>
  <text x="650" y="145" font-weight="bold">Akcija</text>
  <rect x="20" y="155" width="860" height="34" fill="#fff" stroke="#000"/>
  <text x="30" y="177">2026-10-19</text><text x="170" y="177">LJ 12-ABC</text><text x="330" y="177">148.00 €</text><text x="470" y="177">NE</text>
  <rect x="650" y="160" width="190" height="24" fill="#ddd" stroke="#000" stroke-dasharray="4"/>
  <text x="745" y="177" text-anchor="middle" font-size="13">Označi kot plačan</text>
  <rect x="20" y="189" width="860" height="34" fill="#fff" stroke="#000"/>
  <text x="30" y="211">2026-09-02</text><text x="170" y="211">LJ 12-ABC</text><text x="330" y="211">65.50 €</text><text x="470" y="211">DA</text>

  <text x="24" y="250" font-size="11" fill="#555">Stranka vidi samo svoje račune in nima stolpca "Akcija". Brez računov: "Ni računov." (US-13)</text>
  <text x="24" y="268" font-size="11" fill="#555">Črtkani gumb vidi samo vodja; po kliku se vrstica spremeni v "DA". (US-14)</text>
</svg>
