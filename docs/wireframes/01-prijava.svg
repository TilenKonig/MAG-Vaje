<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="sans-serif" font-size="16">
  <title>Wireframe: prijava</title>
  <rect x="1" y="1" width="798" height="498" fill="#fff" stroke="#000"/>
  <!-- glava -->
  <rect x="1" y="1" width="798" height="50" fill="#eee" stroke="#000"/>
  <text x="20" y="32" font-weight="bold">Mehanična delavnica</text>
  <!-- kartica -->
  <rect x="250" y="100" width="300" height="300" fill="#fff" stroke="#000"/>
  <text x="270" y="140" font-size="22" font-weight="bold">Prijava</text>
  <text x="270" y="180" font-size="13">Email</text>
  <rect x="270" y="188" width="260" height="36" fill="#fff" stroke="#000"/>
  <text x="280" y="211" fill="#888">ime@primer.si</text>
  <text x="270" y="255" font-size="13">Geslo</text>
  <rect x="270" y="263" width="260" height="36" fill="#fff" stroke="#000"/>
  <text x="280" y="286" fill="#888">••••••••</text>
  <!-- napaka -->
  <text x="270" y="325" font-size="13" fill="#a00">Napačna e-pošta ali geslo</text>
  <!-- gumb -->
  <rect x="270" y="340" width="260" height="40" fill="#ddd" stroke="#000"/>
  <text x="400" y="366" text-anchor="middle" font-weight="bold">Prijava</text>
  <!-- opombe -->
  <text x="20" y="470" font-size="12" fill="#555">Gumb je onemogočen, dokler polji nista izpolnjeni. Napaka se prikaže samo po neuspeli prijavi. (US-01)</text>
</svg>
