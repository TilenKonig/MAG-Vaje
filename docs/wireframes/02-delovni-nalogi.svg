<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="sans-serif" font-size="14">
  <title>Wireframe: delovni nalogi (pogled mehanika/vodje)</title>
  <rect x="1" y="1" width="898" height="698" fill="#fff" stroke="#000"/>
  <!-- glava z menijem -->
  <rect x="1" y="1" width="898" height="48" fill="#eee" stroke="#000"/>
  <text x="20" y="31" font-weight="bold">Mehanična delavnica</text>
  <text x="260" y="31">Vozila</text>
  <text x="330" y="31" font-weight="bold" text-decoration="underline">Nalogi</text>
  <text x="390" y="31">Deli</text>
  <text x="440" y="31">Računi</text>
  <text x="500" y="31">Uporabniki</text>
  <text x="880" y="31" text-anchor="end">ana@delavnica.si (MEHANIK) | Odjava</text>

  <!-- naslov + gumb (samo vodja) -->
  <text x="20" y="90" font-size="22" font-weight="bold">Delovni nalogi</text>
  <rect x="740" y="68" width="140" height="32" fill="#ddd" stroke="#000" stroke-dasharray="4"/>
  <text x="810" y="89" text-anchor="middle">Odpri nalog</text>
  <text x="740" y="115" font-size="11" fill="#555">samo vodja</text>

  <!-- tabela nalogov -->
  <rect x="20" y="125" width="860" height="30" fill="#ddd" stroke="#000"/>
  <text x="30" y="145" font-weight="bold">Datum</text>
  <text x="170" y="145" font-weight="bold">Vozilo</text>
  <text x="300" y="145" font-weight="bold">Težava</text>
  <text x="760" y="145" font-weight="bold">Stanje</text>
  <rect x="20" y="155" width="860" height="30" fill="#f4f4f4" stroke="#000"/>
  <text x="30" y="175">2026-10-18</text><text x="170" y="175">LJ 12-ABC</text><text x="300" y="175">Ropotanje v prednjem delu</text><text x="760" y="175">V_DELU</text>
  <rect x="20" y="185" width="860" height="30" fill="#fff" stroke="#000"/>
  <text x="30" y="205">2026-10-19</text><text x="170" y="205">MB 45-XYZ</text><text x="300" y="205">Menjava olja</text><text x="760" y="205">ODPRT</text>
  <text x="900" y="175" font-size="11" fill="#555"></text>
  <text x="24" y="235" font-size="11" fill="#555">Označena vrstica = izbran nalog; podrobnosti so spodaj. Prazen seznam: "Ni nalogov."</text>

  <!-- podrobnosti izbranega naloga -->
  <rect x="20" y="250" width="860" height="430" fill="#fff" stroke="#000"/>
  <text x="36" y="280" font-size="18" font-weight="bold">Škoda Octavia, LJ 12-ABC</text>
  <text x="36" y="305">Težava: Ropotanje v prednjem delu</text>

  <!-- urejanje (mehanik, vodja) -->
  <text x="36" y="340" font-size="12">Stanje</text>
  <rect x="36" y="346" width="130" height="32" fill="#fff" stroke="#000"/>
  <text x="46" y="367">V_DELU   ▾</text>
  <text x="186" y="340" font-size="12">Opis opravljenega dela</text>
  <rect x="186" y="346" width="400" height="32" fill="#fff" stroke="#000"/>
  <text x="196" y="367" fill="#888">Zamenjan zgornji ležaj</text>
  <text x="606" y="340" font-size="12">Ure dela</text>
  <rect x="606" y="346" width="90" height="32" fill="#fff" stroke="#000"/>
  <text x="616" y="367">1.5</text>
  <rect x="716" y="346" width="100" height="32" fill="#ddd" stroke="#000"/>
  <text x="766" y="367" text-anchor="middle">Shrani</text>
  <text x="36" y="398" font-size="11" fill="#555">Pri stanju OBRACUNAN ali pri stranki so polja samo za branje. (US-07, US-08)</text>

  <!-- deli -->
  <text x="36" y="435" font-size="16" font-weight="bold">Uporabljeni deli</text>
  <rect x="700" y="415" width="116" height="30" fill="#ddd" stroke="#000"/>
  <text x="758" y="435" text-anchor="middle">Dodaj del</text>
  <rect x="36" y="455" width="780" height="28" fill="#ddd" stroke="#000"/>
  <text x="46" y="474" font-weight="bold">Del</text><text x="400" y="474" font-weight="bold">Količina</text><text x="640" y="474" font-weight="bold">Cena</text>
  <rect x="36" y="483" width="780" height="28" fill="#fff" stroke="#000"/>
  <text x="46" y="502">Zgornji ležaj</text><text x="400" y="502">2</text><text x="640" y="502">24.00 €</text>
  <text x="36" y="530" font-size="11" fill="#555">Brez delov: "Ni dodanih delov." (US-09)</text>

  <!-- okno za dodajanje dela -->
  <rect x="470" y="545" width="346" height="120" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="486" y="570" font-weight="bold">Dodaj del (okno)</text>
  <rect x="486" y="580" width="200" height="28" fill="#fff" stroke="#000"/><text x="494" y="599">Del  ▾</text>
  <rect x="696" y="580" width="60" height="28" fill="#fff" stroke="#000"/><text x="704" y="599">Kol.</text>
  <rect x="486" y="620" width="90" height="30" fill="#ddd" stroke="#000"/><text x="531" y="640" text-anchor="middle">Dodaj</text>
  <text x="590" y="640" font-size="12" fill="#a00">Premalo zaloge (US-10)</text>

  <!-- vodja -->
  <rect x="36" y="590" width="150" height="32" fill="#ddd" stroke="#000" stroke-dasharray="4"/>
  <text x="111" y="611" text-anchor="middle">Izdaj račun</text>
  <rect x="200" y="590" width="150" height="32" fill="#fff" stroke="#000" stroke-dasharray="4"/>
  <text x="275" y="611" text-anchor="middle">Izbriši nalog</text>
  <text x="36" y="645" font-size="11" fill="#555">Črtkano = samo vodja. "Izdaj račun" samo pri stanju ZAKLJUCEN. (US-11)</text>
</svg>
