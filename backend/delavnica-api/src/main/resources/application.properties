spring.application.name=delavnica-api

# CockroachDB (docker compose), povezava prek PostgreSQL gonilnika
spring.datasource.url=jdbc:postgresql://localhost:26257/delavnica?sslmode=disable
spring.datasource.username=root

# Hibernate sam ustvari tabele
spring.jpa.hibernate.ddl-auto=update

# Sporočila napak (npr. "Premalo zaloge") se vrnejo odjemalcu
server.error.include-message=always

# Skrivnost za podpis JWT (samo za razvoj, najmanj 32 znakov)
jwt.secret=delavnica-razvojna-skrivnost-32-znakov!
